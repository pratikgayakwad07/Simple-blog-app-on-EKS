apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: blog-app

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

      - name: frontend

        image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/blog-frontend:latest

        ports:
        - containerPort: 3000

        imagePullPolicy: Always

        resources:

          requests:
            cpu: "200m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

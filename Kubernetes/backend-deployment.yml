apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: blog-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:

      - name: backend

        image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/blog-backend:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:

        - name: DB_HOST
          value: "YOUR-RDS-ENDPOINT"

        - name: DB_PORT
          value: "3306"

        - name: DB_NAME
          value: "blogdb"

        - name: DB_USER
          value: "admin"

        - name: DB_PASSWORD
          value: "password"

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"
